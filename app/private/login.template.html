<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prudential Hong Kong – Competitive Intelligence Report</title>
<style>
:root { --bg: #f4f6f9; --surface: #fff; --ink: #0d1626; --ink-2: #4a5568; --line: #dfe4ec; --accent: #0b63c9; --bad: #b42318; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b0f17; --surface: #131a26; --ink: #eef1f6; --ink-2: #b4bdcb; --line: #263044; --accent: #5aa9f0; --bad: #ff8a80; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
  font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
.logo { height: 64px; display: block; margin-bottom: 20px; }
.logo.dark { display: none; }
@media (prefers-color-scheme: dark) { .logo.light { display: none; } .logo.dark { display: block; } }
h1 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
.err { color: var(--bad); font-size: 13px; margin: 10px 0 0; }
</style>
</head>
<body>
<form class="box" method="post" action="/api/login">
  <img class="logo light" src="{{LOGO_LIGHT}}" alt="BridgeAI">
  <img class="logo dark" src="{{LOGO_DARK}}" alt="BridgeAI">
  <h1>Prudential Hong Kong – Competitive Intelligence Report</h1>
  <p>This report is confidential. Sign in to continue.</p>
  <label for="user">Username</label>
  <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="pw" style="margin-top:12px">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  {{ERROR}}
  <button type="submit">Open report</button>
</form>
</body>
</html>
